# Railway deployment configuration
# https://docs.railway.app/reference/config-as-code
#
# Railway's one-click template flow doesn't natively support image-only
# deploys, so we use a thin wrapper Dockerfile (./Dockerfile) that just
# inherits FROM ghcr.io/liberzon/agents-gateway:latest. The "build" is
# effectively a fast image pull.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/scripts/start_server.sh"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "agents-gateway"
