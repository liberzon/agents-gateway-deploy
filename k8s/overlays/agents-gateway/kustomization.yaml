# Kustomize overlay for agents-gateway
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reference the base manifests
resources:
  - ../../base
  - namespace.yaml

# Deploy to this namespace
namespace: agents-gateway

# Prefix all resource names
namePrefix: agents-gateway-

# Common labels for this project
commonLabels:
  app.kubernetes.io/name: agents-gateway
  app.kubernetes.io/component: api

# Image configuration (tag is set during deployment)
images:
  - name: placeholder
    newName: ghcr.io/liberzon/agents-gateway
    newTag: latest

# ConfigMap customization
configMapGenerator:
  - name: app-config
    behavior: merge
    literals:
      - ENVIRONMENT=production

# Patches for project-specific configuration
patches:
  # Update deployment with project-specific settings
  - target:
      kind: Deployment
      name: app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "256Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "100m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "512Mi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "500m"
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/path
        value: "/health"
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
        value: "/health"
