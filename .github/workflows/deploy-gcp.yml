name: Deploy to Google Cloud Run

on:
  # Trigger after docker-publish completes
  workflow_run:
    workflows: ["Build and Publish Docker Images"]
    types:
      - completed
    branches:
      - main

  # Manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        default: 'latest'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  IMAGE_NAME: agents-gateway

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run if docker-publish succeeded (for workflow_run trigger)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout deployment repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Determine image tag
        id: image
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "environment=development" >> $GITHUB_OUTPUT
          fi

      - name: Set service name based on environment
        id: service
        run: |
          ENV="${{ steps.image.outputs.environment }}"
          case $ENV in
            production)
              echo "name=agents-gateway" >> $GITHUB_OUTPUT
              echo "min_instances=1" >> $GITHUB_OUTPUT
              ;;
            staging)
              echo "name=staging-agents-gateway" >> $GITHUB_OUTPUT
              echo "min_instances=0" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "name=dev-agents-gateway" >> $GITHUB_OUTPUT
              echo "min_instances=0" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ steps.service.outputs.name }} \
            --image="ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}" \
            --platform=managed \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --service-account="${{ secrets.GCP_SERVICE_ACCOUNT }}" \
            --min-instances=${{ steps.service.outputs.min_instances }} \
            --memory=512Mi \
            --cpu=1 \
            --set-env-vars="ENVIRONMENT=${{ steps.image.outputs.environment }}" \
            --set-env-vars="DB_USER=${{ secrets.DB_USER }}" \
            --set-env-vars="DB_PASS=${{ secrets.DB_PASS }}" \
            --set-env-vars="DB_HOST=${{ secrets.DB_HOST }}" \
            --set-env-vars="DB_PORT=${{ secrets.DB_PORT }}" \
            --set-env-vars="DB_DATABASE=${{ secrets.DB_DATABASE }}" \
            --set-env-vars="SERVICE_PROMPTS=${{ secrets.SERVICE_PROMPTS }}" \
            --set-env-vars="GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" \
            --set-env-vars="QDRANT_URL=${{ secrets.QDRANT_URL }}" \
            --set-env-vars="QDRANT_API_KEY=${{ secrets.QDRANT_API_KEY }}" \
            --set-env-vars="SECRET_TOKEN_ENC_KEY=${{ secrets.SECRET_TOKEN_ENC_KEY }}" \
            ${{ secrets.VPC_CONNECTOR && format('--vpc-connector={0} --vpc-egress=private-ranges-only', secrets.VPC_CONNECTOR) || '' }}

      - name: Get service URL
        id: url
        run: |
          URL=$(gcloud run services describe ${{ steps.service.outputs.name }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format='value(status.url)')
          echo "url=${URL}" >> $GITHUB_OUTPUT

      - name: Verify deployment
        run: |
          echo "Verifying deployment at ${{ steps.url.outputs.url }}"
          curl -s -o /dev/null -w "%{http_code}" "${{ steps.url.outputs.url }}/health" | grep -q "200" || exit 1
          echo "Health check passed!"

      - name: Generate deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ steps.image.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** ${{ steps.service.outputs.name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Health Check" >> $GITHUB_STEP_SUMMARY
          echo "✅ Service is healthy" >> $GITHUB_STEP_SUMMARY